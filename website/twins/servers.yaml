openapi: 3.1.0
info:
  title: Files
  version: '1.0'
servers:
  - url: https://api.example.com/v1
paths:
  /files:
    get:
      tags: [files]
      operationId: listFiles
      responses:
        '200':
          description: The files.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /files/{name}:
    servers:
      - url: https://uploads.example.com
    put:
      tags: [files]
      operationId: uploadFile
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: Stored.
