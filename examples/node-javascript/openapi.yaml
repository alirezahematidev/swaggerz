openapi: 3.0.3
info:
  title: Tasks API
  version: 1.0.0
servers:
  - url: http://localhost:3000
security:
  - apiKey: []
paths:
  /tasks:
    get:
      operationId: listTasks
      tags: [Tasks]
      summary: Lists tasks.
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TaskStatus'
        - name: tag
          in: query
          description: Only tasks with all of these tags.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: The tasks.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
    post:
      operationId: createTask
      tags: [Tasks]
      summary: Creates a task.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewTask'
      responses:
        '201':
          description: The created task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
  /tasks/{taskId}:
    get:
      operationId: getTask
      tags: [Tasks]
      summary: Returns one task.
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: No such task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    TaskStatus:
      type: string
      enum: [todo, doing, done]
    Task:
      type: object
      required: [id, title, status, tags]
      properties:
        id:
          type: integer
        title:
          type: string
        status:
          $ref: '#/components/schemas/TaskStatus'
        tags:
          type: array
          items:
            type: string
        dueDate:
          type: string
          format: date
          nullable: true
    NewTask:
      type: object
      required: [title]
      properties:
        title:
          type: string
        tags:
          type: array
          items:
            type: string
        dueDate:
          type: string
          format: date
          nullable: true
    Problem:
      type: object
      required: [title]
      properties:
        title:
          type: string
