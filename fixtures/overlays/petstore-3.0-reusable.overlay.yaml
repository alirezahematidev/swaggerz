# Overlay Specification 1.2: one reusable action applied to several targets.
overlay: 1.2.0
info:
  title: Reusable actions
  version: 1.0.0
components:
  actions:
    internal:
      description: Marks an operation as internal.
      fields:
        update:
          x-internal: true
          tags: [internal]
actions:
  - $ref: '#/components/actions/internal'
    target: $.paths['/user/login'].get
  - $ref: '#/components/actions/internal'
    target: $.paths['/user/logout'].get
