# Publishing happens only here, never from a developer machine. See CONTRIBUTING.md#releases.
# `pnpm release` (release-it) bumps the version, updates CHANGELOG.md and pushes a `v*` tag; this
# workflow verifies the tagged commit, publishes it to npm and creates the GitHub release.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    # Keeps forks from attempting releases.
    if: github.repository == 'alirezahematidev/swaggerz'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Configure required reviewers for this environment to approve each publish.
    environment: npm
    permissions:
      attestations: write # the build provenance of the tarball attached to the GitHub release
      contents: write # the GitHub release
      id-token: write # npm provenance, trusted publishing (OIDC) and the tarball's build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No dependency cache here: a release must not restore state written by other workflows.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # Trusted publishing needs npm 11.5.1 or later, which Node.js 24 bundles; npm publishes, pnpm
      # builds and checks.
      - name: Check the npm version
        run: |
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
              console.error(`::error::npm ${process.argv[1]} is too old for trusted publishing (11.5.1+).`);
              process.exit(1);
            }
          ' "$(npm --version)"
      - run: pnpm install --frozen-lockfile
      - name: Check that the tag matches package.json and is on main
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the package.json version $version."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME does not point to a commit on main."
            exit 1
          fi
      - run: pnpm build
      - run: pnpm check
      - run: pnpm test:pack
      # The package is packed once: npm publishes this tarball, and the GitHub release attaches it
      # with its signed build provenance, so both carry the same bytes.
      - name: Pack
        id: pack
        run: |
          mkdir "$RUNNER_TEMP/pack"
          npm pack --pack-destination "$RUNNER_TEMP/pack"
          echo "tarball=$(find "$RUNNER_TEMP/pack" -name '*.tgz')" >> "$GITHUB_OUTPUT"
      - name: Attest the build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}
      # Pre-releases (v1.2.0-beta.0) go to the `next` dist-tag so `latest` stays stable. A version
      # that is already on npm (a re-run) is skipped. npm uses trusted publishing when it is
      # configured for this workflow and otherwise the NPM_TOKEN secret; both publish with
      # provenance (`publishConfig.provenance`, read from the tarball's package.json).
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          name="$(node -p 'require("./package.json").name')"
          if [ -n "$(npm view "$name@${GITHUB_REF_NAME#v}" version 2>/dev/null)" ]; then
            echo "$name@${GITHUB_REF_NAME#v} is already on npm; skipping the publish."
            exit 0
          fi
          case "$GITHUB_REF_NAME" in
            *-*) npm publish "$TARBALL" --tag next ;;
            *) npm publish "$TARBALL" ;;
          esac
      # The provenance is a Sigstore bundle on one line; `.intoto.jsonl` is the name OpenSSF
      # Scorecard's Signed-Releases check and SLSA tooling look for.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "$TARBALL.intoto.jsonl"
          node scripts/release-notes.ts "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" "$TARBALL" "$TARBALL.intoto.jsonl" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
