name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Test (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.18.0 is the oldest supported version (TypeScript config files need type stripping).
          - { os: ubuntu-latest, node: 22.18.0, lint: false }
          - { os: ubuntu-latest, node: 24, lint: true }
          - { os: macos-latest, node: 24, lint: false }
          - { os: windows-latest, node: 24, lint: false }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn typecheck
      - if: matrix.lint
        run: yarn lint
      - if: matrix.lint
        run: yarn format:check
      - run: yarn build
      - run: yarn test

  runtime:
    name: Generated client on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build
      - run: node dist/cli/bin.js generate --config tests/smoke/swaggerz.config.mjs
      # The generator needs Node 22.18+, the generated client does not.
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: node tests/smoke/runtime.mjs

  compat:
    name: Oldest and newest dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build
      - run: yarn compat

  package:
    name: Packed package (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.18.0, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn test:pack

  examples:
    name: Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - run: node scripts/verify-examples.ts
