name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Test (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.18.0 is the oldest supported version (TypeScript config files need type stripping).
          - { os: ubuntu-latest, node: 22.18.0, lint: false }
          - { os: ubuntu-latest, node: 24, lint: true }
          - { os: macos-latest, node: 24, lint: false }
          - { os: windows-latest, node: 24, lint: false }
    steps:
      - uses: actions/checkout@v5
      # pnpm's version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - if: matrix.lint
        run: pnpm lint
      - if: matrix.lint
        run: pnpm format:check
      - run: pnpm build
      - run: pnpm test

  runtime:
    name: Generated client on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node dist/cli/bin.js generate --config tests/smoke/swaggerz.config.mjs
      # The generator needs Node 22.18+, the generated client does not.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: node tests/smoke/runtime.mjs

  runtimes:
    name: Generated client in ${{ matrix.runtime }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [deno, bun, chromium, firefox, webkit, workerd]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:assets runtime
      # Browsers and workerd are installed by the script; --install-deps adds the browsers' system libraries.
      - run: node scripts/runtimes.ts ${{ matrix.runtime }} --require --install-deps

  corpus:
    name: Public API corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # The documents are pinned to commits and checksums, so the cache never goes stale.
      - uses: actions/cache@v4
        with:
          path: .corpus
          key: corpus-${{ hashFiles('fixtures/corpus/corpus.json') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:assets runtime
      - run: pnpm corpus

  compat:
    name: Oldest and newest dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm compat

  package:
    name: Packed package (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.18.0, 24]
    steps:
      - uses: actions/checkout@v5
      # pnpm's version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:pack

  examples:
    name: Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/verify-examples.ts
